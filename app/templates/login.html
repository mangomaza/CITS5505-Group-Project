{% extends 'base.html' %}

{% block title %}Login &mdash; Mix It Up{% endblock %}

{% block content %}
<main class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">

      <div class="form-card">
        <h2 class="text-center mb-4" style="font-size:1.6rem;">Welcome back</h2>

        <form method="POST" action="{{ url_for('auth.login') }}">

          <!-- Email -->
          <div class="mb-3">
            <label for="loginEmail" class="form-label">Email</label>
            <input type="email" class="form-control" id="loginEmail" name="email" placeholder="you@example.com"
              value="{{ email or '' }}" required>
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label for="loginPassword" class="form-label">Password</label>
            <input type="password" class="form-control" id="loginPassword" name="password" placeholder="Your password"
              required>
          </div>

          <!-- Remember me -->
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe">
            <label class="form-check-label" for="rememberMe" style="font-size:0.85rem; color:var(--mix-text-muted);">
              Remember me
            </label>
          </div>

          <!-- Submit -->
          <button type="submit" class="btn btn-mix w-100">
            Log In
          </button>
        </form>

        <!-- Signup link -->
        <p class="text-center mt-4" style="font-size:0.85rem; color:var(--mix-text-muted);">
          Don't have an account?
          <a href="{{ url_for('auth.signup') }}">Sign up</a>
        </p>
      </div>

    </div>
  </div>
</main>
{% endblock %}
