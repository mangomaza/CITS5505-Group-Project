{% extends 'base.html' %}

{% block title %}Create Recipe &mdash; Mix It Up{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/create_recipe.css') }}">
{% endblock %}

{% block content %}
  <main class="container my-4">
    <div class="row justify-content-center">
      <div class="col-lg-8">

        <h1 class="mb-4">Create a recipe</h1>

        <div class="form-card create-form">
          <form>

            <!-- Basic Info -->
            <div class="form-section">
              <div class="section-title">Basic info</div>
              <div class="mb-3">
                <label for="recipeName" class="form-label">Recipe name</label>
                <input type="text" class="form-control" id="recipeName" placeholder="e.g. Spicy Mango Margarita" required>
              </div>
              <div class="mb-3">
                <label for="recipeDesc" class="form-label">Description</label>
                <textarea class="form-control" id="recipeDesc" rows="2" placeholder="A short description of your recipe"></textarea>
              </div>
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="recipeCategory" class="form-label">Category</label>
                  <select class="form-select" id="recipeCategory">
                    <option value="">Select a category</option>
                    <option value="cocktail">Cocktail</option>
                    <option value="food">Food</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label for="recipeGlass" class="form-label">Glass type (optional)</label>
                  <input type="text" class="form-control" id="recipeGlass" placeholder="e.g. Cocktail glass">
                </div>
              </div>
            </div>

            <!-- Image -->
            <div class="form-section">
              <div class="section-title">Photo</div>
              <div class="upload-area" id="uploadArea">
                <div class="upload-placeholder">
                  <i class="bi bi-camera"></i>
                  <p>Click to upload a photo</p>
                </div>
                <img class="upload-preview" id="imagePreview" alt="Preview">
              </div>
              <input type="file" id="recipeImage" accept="image/*" hidden>
            </div>

            <!-- Ingredients -->
            <div class="form-section">
              <div class="section-title">Ingredients</div>
              <div id="ingredientList">
                <div class="ingredient-row">
                  <input type="text" class="form-control" placeholder="Ingredient name">
                  <input type="text" class="form-control" placeholder="Qty">
                  <input type="text" class="form-control" placeholder="Unit">
                  <button type="button" class="btn-remove" title="Remove"><i class="bi bi-x-lg"></i></button>
                </div>
                <div class="ingredient-row">
                  <input type="text" class="form-control" placeholder="Ingredient name">
                  <input type="text" class="form-control" placeholder="Qty">
                  <input type="text" class="form-control" placeholder="Unit">
                  <button type="button" class="btn-remove" title="Remove"><i class="bi bi-x-lg"></i></button>
                </div>
                <div class="ingredient-row">
                  <input type="text" class="form-control" placeholder="Ingredient name">
                  <input type="text" class="form-control" placeholder="Qty">
                  <input type="text" class="form-control" placeholder="Unit">
                  <button type="button" class="btn-remove" title="Remove"><i class="bi bi-x-lg"></i></button>
                </div>
              </div>
              <button type="button" class="btn-add-ingredient mt-2" id="addIngredient">
                <i class="bi bi-plus"></i> Add ingredient
              </button>
            </div>

            <!-- Instructions -->
            <div class="form-section">
              <div class="section-title">Instructions</div>
              <div class="mb-3">
                <textarea class="form-control" rows="6" placeholder="Describe how to make this recipe..."></textarea>
              </div>
            </div>

            <!-- Submit -->
            <div class="form-actions">
              <button type="submit" class="btn btn-mix">Create Recipe</button>
              <a href="{{ url_for('main.recipes') }}" class="cancel-link">Cancel</a>
            </div>

          </form>
        </div>

      </div>
    </div>
  </main>
{% endblock %}
