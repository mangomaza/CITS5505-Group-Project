<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipes - Mix It Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/style.css">

</head>

<body class="d-flex flex-column min-vh-100">
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
      <div class="container">
        <a class="navbar-brand" href="index.html">Mix It Up</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link active" href="recipes.html">Recipes</a></li>
            <li class="nav-item"><a class="nav-link" href="create_recipe.html">Create</a></li>
            <li class="nav-item"><a class="nav-link" href="share.html">Share</a></li>
          </ul>
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
            <li class="nav-item"><a class="nav-link" href="signup.html">Sign Up</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 mb-0">Recipes</h1>
    </div>

    <div class="random-suggestion-card mb-4 p-3 rounded-4 shadow-sm bg-white border">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
        <div>
          <p class="text-uppercase small text-muted mb-1">Random Recipe Suggestion</p>
          <h2 class="h5 mb-1" id="randomRecipeName">Loading suggestion...</h2>
          <p class="mb-0 text-muted" id="randomRecipeMeta"></p>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-dark btn-sm" onclick="showRandomRecipe()">Try another</button>
          <a id="randomRecipeLink" class="btn btn-dark btn-sm" href="#">View recipe</a>
        </div>
      </div>
    </div>

    <div class="row g-2 mb-4">
      <div class="col-md-6">
        <input type="text" class="form-control" id="searchInput" placeholder="Search recipes...">
      </div>
      <div class="col-md-3">
        <select class="form-select" id="typeFilter">
          <option value="">All types</option>
          <option value="cocktail">Cocktail</option>
          <option value="food">Food</option>
        </select>
      </div>
    </div>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-2 row-cols-lg-3 g-4" id="recipeGrid">
    </div>

    <p class="text-muted text-center mt-4 d-none" id="emptyMsg">No recipes match your search.</p>
  </main>

  <footer class="bg-dark text-light py-3 mt-auto">
    <div class="container text-center">
      <p class="mb-0">© 2026 Mix It Up</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const recipes = [
      { id: 1, name: "Sunset Spritz", type: "cocktail", emoji: "🍹", rating: 4.2, ratings: 8, author: "Ricky" },
      { id: 2, name: "Garlic Flatbread", type: "food", emoji: "🍞", rating: 3.9, ratings: 12, author: "Wendy" },
      { id: 3, name: "Classic Negroni", type: "cocktail", emoji: "🍸", rating: 4.5, ratings: 20, author: "Wendy" },
      { id: 4, name: "Summer Salad", type: "food", emoji: "🥗", rating: 4.0, ratings: 7, author: "Asad Maza" },
      { id: 5, name: "Mango Daiquiri", type: "cocktail", emoji: "🥭", rating: 4.5, ratings: 15, author: "Wenmin" },
    ];

    const badgeClass = { cocktail: "badge-cocktail", food: "badge-food" };
    const bgColor = { cocktail: "#EEEDFE", food: "#FAEEDA" };

    function starsHTML(rating) {
      const full = Math.round(rating);
      let s = "";
      for (let i = 1; i <= 5; i++) {
        s += i <= full ? "★" : "☆";
      }
      return `<span class="stars">${s}</span> <small class="text-muted">${rating.toFixed(1)}</small>`;
    }

    function cardHTML(r) {
      return `
        <div class="col recipe-item" data-type="${r.type}" data-name="${r.name.toLowerCase()}" data-rating="${r.rating}">
          <div class="card recipe-card h-100" data-type="${r.type}" onclick="location.href='recipe_detail.html?id=${r.id}'">
            <div class="card-emoji" style="background:${bgColor[r.type]}">${r.emoji}</div>
            <div class="card-body py-2 px-3">
              <p class="card-title mb-1">${r.name}</p>
              <div class="d-flex justify-content-between align-items-center">
                <span class="badge rounded-pill ${badgeClass[r.type]} small">${r.type}</span>
                <span>${starsHTML(r.rating)}</span>
              </div>
              <p class="text-muted small mt-1 mb-0">by @${r.author} · ${r.ratings} ratings</p>
            </div>
          </div>
        </div>`;
    }

    function showRandomRecipe() {
      const random = recipes[Math.floor(Math.random() * recipes.length)];

      document.getElementById("randomRecipeName").textContent = `${random.emoji} ${random.name}`;
      document.getElementById("randomRecipeMeta").textContent =
        `${random.type} · ${random.rating.toFixed(1)} stars · by @${random.author}`;
      document.getElementById("randomRecipeLink").href = `recipe_detail.html?id=${random.id}`;
    }

    function render() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const type = document.getElementById("typeFilter").value;

      let filtered = recipes.filter(r =>
        r.name.toLowerCase().includes(q) &&
        (type === "" || r.type === type)
      );

      const grid = document.getElementById("recipeGrid");
      grid.innerHTML = filtered.map(cardHTML).join("");
      document.getElementById("emptyMsg").classList.toggle("d-none", filtered.length > 0);
    }

    document.getElementById("searchInput").addEventListener("input", render);
    document.getElementById("typeFilter").addEventListener("change", render);

    render();
    showRandomRecipe();
  </script>
</body>

</html>
