    const badgeClass = { cocktail: "badge-cocktail", dessert: "badge-dessert", food: "badge-food" };

    let userRating = 0;

function starHTML() {
  let html = "";
  for (let i = 1; i <= 5; i++) {
    html += `<button type="button" class="star-btn ${i <= userRating ? "active" : ""}"
               onmouseover="highlightStars(${i})"
               onmouseout="resetStars()"
               onclick="chooseRating(${i})">★</button>`;
  }
  return html;
}

function chooseRating(n) {
  userRating = n;
  resetStars();
  document.getElementById("ratingFeedback").textContent =
    `You selected ${n}/5. Click Submit rating to confirm.`;
}

function highlightStars(n) {
  document.querySelectorAll(".star-btn").forEach((b, i) => {
    b.classList.toggle("active", i < n);
  });
}

function resetStars() {
  document.querySelectorAll(".star-btn").forEach((b, i) => {
    b.classList.toggle("active", i < userRating);
  });
}

function setRating() {
  if (userRating === 0) {
    document.getElementById("ratingFeedback").textContent =
      "Please choose a star rating first.";
    return;
  }

  document.getElementById("ratingFeedback").textContent =
    userRating === 5
      ? "Thanks! You gave 5 stars ⭐"
      : `Thanks! You rated this ${userRating}/5.`;
}

    function starsDisplay(rating) {
      const full = Math.round(rating);
      let s = "";
      for (let i = 1; i <= 5; i++) s += i <= full ? "★" : "☆";
      return `<span style="color:#f2c37c">${s}</span>`;
    }
 
    function render(r) {
      const ingredientsHTML = r.ingredients.map(ing => `
        <tr class="ingredient-row">
          <td>${ing.name}</td>
          <td class="text-end text-muted">${ing.amount}</td>
        </tr>`).join("");
 
      const stepsHTML = r.steps.map((step, i) => `
        <div class="step-card">
          <div class="step-num bg-light text-secondary">${i + 1}</div>
          <p class="mb-0" style="line-height:1.6">${step}</p>
        </div>`).join("");
 
      const tagsHTML = (r.tags || []).map(t =>
        `<span class="tag-pill">${t}</span>`
      ).join("");
 
      document.title = `${r.name} - Mix It Up`;
 
      document.getElementById("mainContent").innerHTML = `
        <a href="recipe.html" class="text-muted text-decoration-none small d-inline-flex align-items-center gap-1 mb-3">
          ← Back to recipes
        </a>
 
        <div class="hero-banner d-flex align-items-center gap-4 flex-wrap" style="background:${r.heroColor}">
          <div class="hero-emoji">${r.emoji}</div>
          <div class="flex-grow-1">
            <h1 class="recipe-title">${r.name}</h1>
            <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
              <span class="badge rounded-pill ${badgeClass[r.type]}">${r.type}</span>
              <span class="small">${starsDisplay(r.rating)} ${r.rating.toFixed(1)} (${r.ratings} ratings)</span>
              <span class="small text-muted">by @${r.author}</span>
            </div>
            <p class="recipe-description mb-0">${r.description}</p>
          </div>
          <div class="hero-actions d-flex flex-column gap-2">
            <button class="btn btn-sm btn-outline-secondary" onclick="shareRecipe()">Share</button>
            <button class="btn btn-sm btn-outline-secondary" onclick="saveRecipe()">Save</button>
          </div>
        </div>
 
        ${tagsHTML ? `<div class="mb-4">${tagsHTML}</div>` : ""}
 
        <div class="row gx-5 gy-4 mb-4">
          <div class="col-md-4">
           <div class="info-card">
             <div class="section-label">Ingredients</div>
              <table class="w-100">
                <tbody>${ingredientsHTML}</tbody>
              </table>
           </div>
         </div>

  <div class="col-md-8">
    <div class="info-card">
      <div class="section-label">Method</div>
      ${stepsHTML}
    </div>
  </div>
</div>
 
        <div class="rating-box">
          <p class="section-label mb-2">Rate this recipe</p>
          <div class="d-flex align-items-center gap-3 flex-wrap">
            <div id="starWidget">${starHTML()}</div>
            <button type="button" class="btn btn-sm btn-dark" onclick="setRating()">Submit rating</button>
            <span id="ratingFeedback" class="small text-muted"></span>
          </div>
        </div>`;
    }
 
    function shareRecipe() {
      if (navigator.share) {
        navigator.share({ title: recipe.name, url: location.href });
      } else {
        navigator.clipboard.writeText(location.href);
        alert("Link copied to clipboard!");
      }
    }
 
    function saveRecipe() {
      // TODO: POST to your backend save endpoint
      alert("Recipe saved!");
    }
 
    const params = new URLSearchParams(location.search);
    const id     = parseInt(params.get("id")) || 1;
    const recipe = recipeDB[id];
 
    if (recipe) {
      render(recipe);
    } else {
      document.getElementById("mainContent").innerHTML = `
        <div class="text-center py-5">
          <p class="text-muted">Recipe not found.</p>
          <a href="recipe.html" class="btn btn-outline-secondary btn-sm">Back to recipes</a>
        </div>`;
    }
  </script>
</body>
