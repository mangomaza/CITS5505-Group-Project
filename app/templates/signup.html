<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up &mdash; Mix It Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg sticky-top">
      <div class="container">
        <a class="navbar-brand" href="index.html">Mix It Up</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="recipes.html">Recipes</a></li>
            <li class="nav-item"><a class="nav-link" href="create_recipe.html">Create</a></li>
            <li class="nav-item"><a class="nav-link" href="share.html">Share</a></li>
          </ul>
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
            <li class="nav-item"><a class="nav-link active" href="signup.html">Sign Up</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">

        <div class="form-card">
          <h2 class="text-center mb-4" style="font-size:1.6rem;">Create an account</h2>

          <form>
            <div class="mb-3">
              <label for="signupName" class="form-label">Username</label>
              <input type="text" class="form-control" id="signupName" placeholder="Your username" required>
            </div>
            <div class="mb-3">
              <label for="signupEmail" class="form-label">Email</label>
              <input type="email" class="form-control" id="signupEmail" placeholder="you@example.com" required>
            </div>
            <div class="mb-3">
              <label for="signupPassword" class="form-label">Password</label>
              <input type="password" class="form-control" id="signupPassword" placeholder="At least 8 characters" required>
            </div>
            <div class="mb-3">
              <label for="signupConfirm" class="form-label">Confirm password</label>
              <input type="password" class="form-control" id="signupConfirm" placeholder="Re-enter password" required>
            </div>
            <button type="submit" class="btn btn-mix w-100">Sign Up</button>
          </form>

          <p class="text-center mt-4" style="font-size:0.85rem; color:var(--mix-text-muted);">
            Already have an account? <a href="login.html">Log in</a>
          </p>
        </div>

      </div>
    </div>
  </main>

  <footer class="py-3 mt-auto">
    <div class="container text-center">
      <p class="mb-0">&copy; 2026 Mix It Up</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../static/js/main.js"></script>
</body>
</html>
